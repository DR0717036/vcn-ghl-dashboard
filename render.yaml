# Render Blueprint for the VCN GHL Sales Dashboard (docs/DEPLOY.md, docs/DECISIONS.md #77).
# One Node web service with a persistent disk for the SQLite cache. Secrets are
# never in this file: every entry with "sync: false" is typed into Render's
# dashboard when the Blueprint is first created.
services:
  - type: web
    name: vcn-ghl-dashboard
    runtime: node
    region: ohio
    plan: starter # Render's 0.5c-512mb plan (0.5 CPU, 512 MB); legacy names stay valid in Blueprints
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    disk:
      name: data
      mountPath: /data
      sizeGB: 5
    envVars:
      # Pins the Node major version (the repo also carries .node-version and package.json engines).
      - key: NODE_VERSION
        value: "24"
      # Where the SQLite cache lives: the persistent disk above.
      - key: DATA_DIR
        value: /data
      # All reporting is Eastern time.
      - key: TZ
        value: America/New_York
      # Next reads PORT at start.
      - key: PORT
        value: "3000"
      # Entered in the Render dashboard, never stored in the repo.
      - key: GHL_PRIVATE_TOKEN
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
